      }

      // 靈感 Modal 打開
      function openIdeaModal(editId = null, prefillContent = '') {
        if (editId) {
          const item = state.ideas.find(i => i.id === editId);
          if (!item) return;
          document.getElementById('ideaModalTitle').textContent = '編輯靈感卡片';
          document.getElementById('ideaEditId').value = item.id;
          document.getElementById('ideaTitle').value = item.title;
          document.getElementById('ideaTag').value = item.tag || '角色設定';
          document.getElementById('ideaCustomTag').value = item.customTag || '';
          document.getElementById('ideaContent').value = item.content;
          document.getElementById('ideaIsCompleted').checked = !!item.isCompleted;
        } else {
          document.getElementById('ideaModalTitle').textContent = '新增靈感題材卡片';
          elements.ideaForm.reset();
          document.getElementById('ideaEditId').value = '';
          if (prefillContent) {
            document.getElementById('ideaTitle').value = prefillContent.slice(0, 15) + (prefillContent.length > 15 ? '...' : '');
            document.getElementById('ideaContent').value = prefillContent;
          }
        }
        openModal(elements.ideaModal);
      }

      // ===================================================================
      // Toast 通知顯示
      // ===================================================================
      function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;

        elements.toastContainer.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(10px) scale(0.9)';
          setTimeout(() => {
            if (toast.parentNode) {
              toast.parentNode.removeChild(toast);
            }
          }, 250);
        }, 2800);
      }

      // ===================================================================
      // 事件監聽與綁定
      // ===================================================================
      function bindEvents() {
        // 1. 主題切換按鈕
        elements.themeToggleBtn.addEventListener('click', toggleTheme);

        // 2. 搜尋列即時輸入
        elements.globalSearchInput.addEventListener('input', (e) => {
          state.searchQuery = e.target.value.trim();
          elements.clearSearchBtn.style.display = state.searchQuery ? 'block' : 'none';
          renderAll();
        });

        elements.clearSearchBtn.addEventListener('click', () => {
          elements.globalSearchInput.value = '';
          state.searchQuery = '';
          elements.clearSearchBtn.style.display = 'none';
          renderAll();
        });

        // 3. 欄位內部篩選下拉選單
        elements.homeworkFilter.addEventListener('change', (e) => {
          state.filters.homework = e.target.value;
          renderHomeworks();
        });

        elements.commissionFilter.addEventListener('change', (e) => {
          state.filters.commission = e.target.value;
          renderCommissions();
        });

        elements.ideasFilter.addEventListener('change', (e) => {
          state.filters.ideas = e.target.value;
          renderIdeas();
        });

        // 4. 視圖 Tab 切換 (Desktop & Mobile)
        elements.viewTabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            setTab(btn.dataset.tab);
          });
        });

        elements.mobileNavItems.forEach(item => {
          item.addEventListener('click', () => {
            setTab(item.dataset.nav);
          });
        });

        // 5. 更多設定下拉選單
        elements.moreMenuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          elements.moreMenuDropdown.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
          if (!elements.moreMenuDropdown.contains(e.target) && e.target !== elements.moreMenuBtn) {
            elements.moreMenuDropdown.classList.remove('show');
          }
          if (!elements.fabMenu.contains(e.target) && e.target !== elements.mainFabBtn && !elements.mainFabBtn.contains(e.target)) {
            elements.fabMenu.classList.remove('show');
            elements.mainFabBtn.classList.remove('active');
          }
        });

        // 6. 懸浮按鈕 FAB 控制
        elements.mainFabBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          elements.fabMenu.classList.toggle('show');
          elements.mainFabBtn.classList.toggle('active');
        });

        elements.fabAddHomeworkBtn.addEventListener('click', () => {
          elements.fabMenu.classList.remove('show');
          elements.mainFabBtn.classList.remove('active');
          openHomeworkModal();
        });

        elements.fabAddCommissionBtn.addEventListener('click', () => {
          elements.fabMenu.classList.remove('show');
          elements.mainFabBtn.classList.remove('active');
          openCommissionModal();
        });

        elements.fabAddIdeaBtn.addEventListener('click', () => {
          elements.fabMenu.classList.remove('show');
          elements.mainFabBtn.classList.remove('active');
          openIdeaModal();
        });

        // 7. 新增按鈕綁定 (欄位頂部按鈕)
        elements.openAddHomeworkBtn.addEventListener('click', () => openHomeworkModal());
        elements.openAddCommissionBtn.addEventListener('click', () => openCommissionModal());
        elements.openAddIdeaBtn.addEventListener('click', () => openIdeaModal());

        // 8. 關閉 Modal 通用按鈕與背景點擊
        document.querySelectorAll('[data-close-modal]').forEach(btn => {
          btn.addEventListener('click', () => {
            const modalId = btn.getAttribute('data-close-modal');
            const modal = document.getElementById(modalId);
            if (modal) closeModal(modal);
          });
        });

        [elements.homeworkModal, elements.commissionModal, elements.ideaModal].forEach(modal => {
          modal.addEventListener('click', (e) => {
            if (e.target === modal) {
              closeModal(modal);
            }
          });
        });

        // 9. 進度條 Range 滑桿數字同步顯示
        elements.hwProgressPercent.addEventListener('input', (e) => {
          elements.hwPercentDisplay.textContent = e.target.value;
          const completedCheckbox = document.getElementById('hwIsCompleted');
          if (Number(e.target.value) === 100) {
            completedCheckbox.checked = true;
          }
        });

        elements.commProgressPercent.addEventListener('input', (e) => {
          elements.commPercentDisplay.textContent = e.target.value;
          const completedCheckbox = document.getElementById('commIsCompleted');
          if (Number(e.target.value) === 100) {
            completedCheckbox.checked = true;
          }
        });

        // 10. 表單提交：學校作業
        elements.homeworkForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const editId = document.getElementById('hwEditId').value;
          const isCompleted = document.getElementById('hwIsCompleted').checked;
          let progressPercent = Number(elements.hwProgressPercent.value);
          if (isCompleted && progressPercent < 100) {
            progressPercent = 100;
          }

          const itemData = {
            title: document.getElementById('hwTitle').value.trim(),
            deadline: document.getElementById('hwDeadline').value,
            content: document.getElementById('hwContent').value.trim(),
            progress: document.getElementById('hwProgress').value.trim() || (isCompleted ? '已完稿' : '進行中'),
            progressPercent: progressPercent,
            isCompleted: isCompleted,
            updatedAt: new Date().toISOString()
          };

          if (editId) {
            const idx = state.homeworks.findIndex(h => h.id === editId);
            if (idx !== -1) {
              state.homeworks[idx] = { ...state.homeworks[idx], ...itemData };
              showToast('已更新學校作業', 'success');
            }
          } else {
            itemData.id = 'hw_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            itemData.createdAt = new Date().toISOString();
            state.homeworks.unshift(itemData);
            showToast('已新增學校作業', 'success');
          }

          saveData();
          renderAll();
          closeModal(elements.homeworkModal);
        });

        // 11. 表單提交：委託案件
        elements.commissionForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const editId = document.getElementById('commEditId').value;
          const isCompleted = document.getElementById('commIsCompleted').checked;
          let progressPercent = Number(elements.commProgressPercent.value);
          if (isCompleted && progressPercent < 100) {
            progressPercent = 100;
          }

          const itemData = {
            client: document.getElementById('commClient').value.trim(),
            price: Number(document.getElementById('commPrice').value) || 0,
            content: document.getElementById('commContent').value.trim(),
            paymentStatus: document.getElementById('commPaymentStatus').value,
            deadline: document.getElementById('commDeadline').value,
            progress: document.getElementById('commProgress').value.trim() || (isCompleted ? '已交付' : '進行中'),
            progressPercent: progressPercent,
            isCompleted: isCompleted,
            updatedAt: new Date().toISOString()
          };

          if (editId) {
            const idx = state.commissions.findIndex(c => c.id === editId);
            if (idx !== -1) {
              state.commissions[idx] = { ...state.commissions[idx], ...itemData };
              showToast('已更新委託案件', 'success');
            }
          } else {
            itemData.id = 'comm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            itemData.createdAt = new Date().toISOString();
            state.commissions.unshift(itemData);
            showToast('已新增委託案件', 'success');
          }

          saveData();
          renderAll();
          closeModal(elements.commissionModal);
        });

        // 12. 表單提交：靈感題材
        elements.ideaForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const editId = document.getElementById('ideaEditId').value;
          const isCompleted = document.getElementById('ideaIsCompleted').checked;

          const itemData = {
            title: document.getElementById('ideaTitle').value.trim(),
            tag: document.getElementById('ideaTag').value,
            customTag: document.getElementById('ideaCustomTag').value.trim(),
            content: document.getElementById('ideaContent').value.trim(),
            isCompleted: isCompleted,
            updatedAt: new Date().toISOString()
          };

          if (editId) {
            const idx = state.ideas.findIndex(i => i.id === editId);
            if (idx !== -1) {
              state.ideas[idx] = { ...state.ideas[idx], ...itemData };
              showToast('已更新靈感卡片', 'success');
            }
          } else {
            itemData.id = 'idea_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            itemData.createdAt = new Date().toISOString();
            state.ideas.unshift(itemData);
            showToast('已建立靈感卡片', 'success');
          }

          saveData();
          renderAll();
          closeModal(elements.ideaModal);
        });

        // 13. 事件委派：打勾方格 (完稿結束確認) 與卡片內部操作
        // 學校作業卡片
        elements.homeworkList.addEventListener('click', (e) => {
          const target = e.target;

          // 方格打勾 (完稿)
          if (target.classList.contains('hw-checkbox')) {
            const id = target.dataset.id;
            const item = state.homeworks.find(h => h.id === id);
            if (item) {
              item.isCompleted = target.checked;
              if (item.isCompleted) {
                item.progressPercent = 100;
                item.progress = '已完稿';
                showToast(`🎉 作業「${item.title}」已標記為完稿！`, 'success');
              } else {
                item.progressPercent = 50;
                item.progress = '修改中';
                showToast(`作業「${item.title}」已恢復進行中`, 'info');
              }
              saveData();
              renderAll();
            }
            return;
          }

          // 編輯作業
          const editBtn = target.closest('.edit-hw-btn');
          if (editBtn) {
            openHomeworkModal(editBtn.dataset.id);
            return;
          }

          // 刪除作業
          const deleteBtn = target.closest('.delete-hw-btn');
          if (deleteBtn) {
            const id = deleteBtn.dataset.id;
            const item = state.homeworks.find(h => h.id === id);
            if (item && confirm(`確定要刪除作業「${item.title}」嗎？`)) {
              state.homeworks = state.homeworks.filter(h => h.id !== id);
              saveData();
              renderAll();
              showToast('作業已刪除', 'info');
            }
            return;
          }
        });

        // 委託案件卡片
        elements.commissionList.addEventListener('click', (e) => {
          const target = e.target;

          // 方格打勾 (完稿結案)
          if (target.classList.contains('comm-checkbox')) {
            const id = target.dataset.id;
            const item = state.commissions.find(c => c.id === id);
            if (item) {
              item.isCompleted = target.checked;
              if (item.isCompleted) {
                item.progressPercent = 100;
                item.progress = '完稿交付';
                showToast(`✨ 委託人「${item.client}」的案件已標記為完稿結案！`, 'success');
              } else {
                item.progressPercent = 50;
                showToast(`案件已恢復為進行中`, 'info');
              }
              saveData();
              renderAll();
            }
            return;
          }

          // 快速切換匯款狀態
          const togglePayBtn = target.closest('.toggle-payment-btn');
          if (togglePayBtn) {
            const id = togglePayBtn.dataset.id;
            const item = state.commissions.find(c => c.id === id);
            if (item) {
              item.paymentStatus = cyclePaymentStatus(item.paymentStatus);
              saveData();
              renderAll();
              showToast(`已切換匯款狀態為：${item.paymentStatus}`, 'info');
            }
            return;
          }

          // 編輯委託
          const editBtn = target.closest('.edit-comm-btn');
          if (editBtn) {
            openCommissionModal(editBtn.dataset.id);
            return;
          }

          // 刪除委託
          const deleteBtn = target.closest('.delete-comm-btn');
          if (deleteBtn) {
            const id = deleteBtn.dataset.id;
            const item = state.commissions.find(c => c.id === id);
            if (item && confirm(`確定要刪除案主「${item.client}」的委託嗎？`)) {
              state.commissions = state.commissions.filter(c => c.id !== id);
              saveData();
              renderAll();
              showToast('委託案件已刪除', 'info');
            }
            return;
          }
        });

        // 靈感題材卡片
        elements.ideasList.addEventListener('click', (e) => {
          const target = e.target;

          // 方格打勾 (已採用/完稿)
          if (target.classList.contains('idea-checkbox')) {
            const id = target.dataset.id;
            const item = state.ideas.find(i => i.id === id);
            if (item) {
              item.isCompleted = target.checked;
              saveData();
              renderAll();
              showToast(item.isCompleted ? '💡 靈感已標記為完稿/已採用！' : '靈感標記為未完結', 'info');
            }
            return;
          }

          // 編輯靈感
          const editBtn = target.closest('.edit-idea-btn');
          if (editBtn) {
            openIdeaModal(editBtn.dataset.id);
            return;
          }

          // 刪除靈感
          const deleteBtn = target.closest('.delete-idea-btn');
          if (deleteBtn) {
            const id = deleteBtn.dataset.id;
            const item = state.ideas.find(i => i.id === id);
            if (item && confirm(`確定要刪除靈感「${item.title}」嗎？`)) {
              state.ideas = state.ideas.filter(i => i.id !== id);
              saveData();
              renderAll();
              showToast('靈感卡片已刪除', 'info');
            }
            return;
          }
        });

        // 14. 備份匯出 JSON
        elements.exportDataBtn.addEventListener('click', () => {
          elements.moreMenuDropdown.classList.remove('show');
          const backupData = {
            app: 'Task & Studio Hub',
            version: '1.0',
            exportedAt: new Date().toISOString(),
            homeworks: state.homeworks,
            commissions: state.commissions,
            ideas: state.ideas,
            scratchpad: localStorage.getItem(SCRATCHPAD_KEY) || ''
          };
          const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `StudioHub_Backup_${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('📥 備份資料已成功匯出', 'success');
        });

        // 15. 備份匯入 JSON
        elements.importFileInput.addEventListener('change', (e) => {
          elements.moreMenuDropdown.classList.remove('show');
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (imported.homeworks || imported.commissions || imported.ideas) {
                state.homeworks = imported.homeworks || [];
                state.commissions = imported.commissions || [];
                state.ideas = imported.ideas || [];
                if (imported.scratchpad) {
                  elements.scratchpadInput.value = imported.scratchpad;
                  localStorage.setItem(SCRATCHPAD_KEY, imported.scratchpad);
                }
                saveData();
                renderAll();
                showToast('✅ 備份資料已順利還原匯入！', 'success');
              } else {
                showToast('⚠️ 檔案格式不符合備份規範', 'error');
              }
            } catch (err) {
              showToast('⚠️ JSON 解析失敗，請確認檔案格式', 'error');
            }
          };
          reader.readAsText(file);
          e.target.value = '';
        });

        // 16. 載入預設示範資料
        elements.loadSampleDataBtn.addEventListener('click', () => {
          elements.moreMenuDropdown.classList.remove('show');
          if (confirm('確定要載入預設範例資料嗎？（這將會合併新增範例項目）')) {
            state.homeworks = [...DEFAULT_DATA.homeworks, ...state.homeworks];
            state.commissions = [...DEFAULT_DATA.commissions, ...state.commissions];
            state.ideas = [...DEFAULT_DATA.ideas, ...state.ideas];
            saveData();
            renderAll();
            showToast('已載入範例資料', 'success');
          }
        });

        // 17. 清空所有資料
        elements.clearAllDataBtn.addEventListener('click', () => {
          elements.moreMenuDropdown.classList.remove('show');
          if (confirm('⚠️ 警告：這將會清除您所有的作業、委託與靈感資料！確定要重置嗎？')) {
            state.homeworks = [];
            state.commissions = [];
            state.ideas = [];
            saveData();
            renderAll();
            showToast('已清空所有看板資料', 'warning');
          }
        });

        // 18. ESC 鍵快速關閉所有 Modal
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            closeModal(elements.homeworkModal);
            closeModal(elements.commissionModal);
            closeModal(elements.ideaModal);
            elements.moreMenuDropdown.classList.remove('show');
            elements.fabMenu.classList.remove('show');
            elements.mainFabBtn.classList.remove('active');
          }
        });
      }

      // 啟動應用
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();

  </script>
</body>

</html>
